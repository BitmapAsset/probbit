[workspace]
resolver = "2"
members = ["pbit-core", "pbit-ir", "pbit-decide", "pbit-cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/BitmapAsset/pbit"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 3
