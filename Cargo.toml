[workspace]
resolver = "2"
members = ["probbit-core", "probbit-ir", "probbit-decide", "probbit-cli", "probbit-wasm"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"
repository = "https://github.com/BitmapAsset/probbit"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 3
