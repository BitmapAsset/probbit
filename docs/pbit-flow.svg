<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07090f"/><stop offset="1" stop-color="#0b0f1a"/></linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ee7ff"/></marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff4fd8"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1a2236" stroke-width="1"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#grid)" opacity="0.5"/>
  <text x="60" y="64" fill="#ffffff" font-size="30" font-weight="700">pbit</text>
  <text x="140" y="64" fill="#8b95ad" font-size="20">a virtual probabilistic processor · how one decision flows, from your app down to the metal and back</text>

  <!-- 1. APP -->
  <rect x="60" y="100" width="1480" height="96" rx="12" fill="#0f1524" stroke="#2b3550" stroke-width="2"/>
  <text x="84" y="132" fill="#5ee7ff" font-size="15" font-weight="700">1 · YOUR APPLICATION OR AGENT HARNESS</text>
  <text x="84" y="158" fill="#d5dbe8" font-size="17">any agent framework · LangGraph · MCP server · a cron job · any language (it is just a subprocess)</text>
  <text x="84" y="182" fill="#8b95ad" font-size="15">sends one decision request as JSON:  tasks (scores per worker, allowed workers, group)  +  workers (hard quota)  +  affinity</text>
  <line x1="800" y1="196" x2="800" y2="236" stroke="#5ee7ff" stroke-width="3" marker-end="url(#arr)"/>
  <text x="815" y="222" fill="#5ee7ff" font-size="14">pbit decide --budget-ms 200  &lt; problem.json</text>

  <!-- 2. PROCESSOR -->
  <rect x="60" y="240" width="1480" height="500" rx="14" fill="#0c1120" stroke="#5ee7ff" stroke-width="2.5" filter="url(#glow)"/>
  <text x="84" y="272" fill="#5ee7ff" font-size="15" font-weight="700">2 · THE pbit PROCESSOR  — one Rust binary, zero dependencies, built for macOS, Linux and Windows on x86_64 and arm64</text>

  <!-- decode -->
  <rect x="84" y="292" width="300" height="118" rx="10" fill="#111a2e" stroke="#2b3550" stroke-width="2"/>
  <text x="100" y="318" fill="#ffffff" font-size="15" font-weight="700">INSTRUCTION DECODE</text>
  <text x="100" y="342" fill="#c3cad9" font-size="13">JSON → constrained Potts model</text>
  <text x="100" y="362" fill="#8b95ad" font-size="13">log w(plan) = Σ scores</text>
  <text x="100" y="380" fill="#8b95ad" font-size="13">   + affinity · same-group pairs</text>
  <text x="100" y="398" fill="#8b95ad" font-size="13">hard rules: allowed · quota · clamp</text>
  <line x1="384" y1="351" x2="424" y2="351" stroke="#5ee7ff" stroke-width="3" marker-end="url(#arr)"/>

  <!-- router -->
  <rect x="428" y="292" width="200" height="118" rx="10" fill="#111a2e" stroke="#2b3550" stroke-width="2"/>
  <text x="444" y="318" fill="#ffffff" font-size="15" font-weight="700">ROUTER</text>
  <text x="444" y="342" fill="#c3cad9" font-size="13">how many rule-abiding</text>
  <text x="444" y="360" fill="#c3cad9" font-size="13">plans exist?</text>
  <text x="444" y="386" fill="#8b95ad" font-size="13">≤ 2M → exact unit</text>
  <text x="444" y="402" fill="#8b95ad" font-size="13">more → p-bit unit</text>
  <line x1="628" y1="330" x2="700" y2="330" stroke="#5ee7ff" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="628" y1="380" x2="700" y2="470" stroke="#5ee7ff" stroke-width="3" marker-end="url(#arr)"/>

  <!-- exact unit -->
  <rect x="704" y="292" width="360" height="76" rx="10" fill="#111a2e" stroke="#2b3550" stroke-width="2"/>
  <text x="720" y="318" fill="#ffffff" font-size="15" font-weight="700">EXACT UNIT</text>
  <text x="720" y="340" fill="#c3cad9" font-size="13">enumerates every feasible plan · exact odds</text>
  <text x="720" y="358" fill="#8b95ad" font-size="13">12 tasks × 6 workers: 180,540 plans in 8-9 ms (M4)</text>

  <!-- pbit unit -->
  <rect x="704" y="420" width="360" height="160" rx="10" fill="#141127" stroke="#ff4fd8" stroke-width="2"/>
  <text x="720" y="446" fill="#ff4fd8" font-size="15" font-weight="700">P-BIT SAMPLING UNIT</text>
  <text x="720" y="470" fill="#c3cad9" font-size="13">4 chains on 4 cores, constraint-preserving Gibbs:</text>
  <text x="720" y="488" fill="#c3cad9" font-size="13">site · swap · exact two-group joint moves</text>
  <text x="720" y="512" fill="#ffffff" font-size="13" font-weight="700">every sample obeys every rule, by construction</text>
  <text x="720" y="536" fill="#8b95ad" font-size="13">300 tasks: 23-27k joint samples in 200 ms (M4)</text>
  <text x="720" y="556" fill="#8b95ad" font-size="13">registers = chains · clock = wall-clock budget</text>
  <line x1="1064" y1="500" x2="1130" y2="500" stroke="#ff4fd8" stroke-width="3" marker-end="url(#arrm)"/>

  <!-- gate -->
  <rect x="1134" y="420" width="382" height="160" rx="10" fill="#141127" stroke="#ff4fd8" stroke-width="2"/>
  <text x="1150" y="446" fill="#ff4fd8" font-size="15" font-weight="700">DIAGNOSTICS GATE  (gate/3, the fault flag)</text>
  <text x="1150" y="470" fill="#c3cad9" font-size="13">split R-hat across chains</text>
  <text x="1150" y="488" fill="#c3cad9" font-size="13">error bar per task (dual-batch MCSE, ±0.05)</text>
  <text x="1150" y="506" fill="#c3cad9" font-size="13">frozen-saturated-worker detector</text>
  <text x="1150" y="532" fill="#5ee7ff" font-size="13" font-weight="700">diagnostics passed  →  all tasks released</text>
  <text x="1150" y="550" fill="#ffd166" font-size="13" font-weight="700">partial    →  release sure tasks, escalate rest</text>
  <text x="1150" y="568" fill="#ff6b6b" font-size="13" font-weight="700">refused    →  it knows it does not know</text>

  <!-- polish -->
  <rect x="1134" y="292" width="382" height="76" rx="10" fill="#111a2e" stroke="#2b3550" stroke-width="2"/>
  <text x="1150" y="318" fill="#ffffff" font-size="15" font-weight="700">PLAN POLISH</text>
  <text x="1150" y="340" fill="#c3cad9" font-size="12.5">annealed best plan, 0 rule violations</text>
  <text x="1150" y="358" fill="#8b95ad" font-size="12.5">need the proven optimum? add an ILP/CP solver</text>
  <line x1="1064" y1="330" x2="1130" y2="330" stroke="#5ee7ff" stroke-width="3" marker-end="url(#arr)"/>

  <!-- substrate band -->
  <rect x="84" y="608" width="1432" height="112" rx="10" fill="#0a0f1c" stroke="#2b3550" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="100" y="634" fill="#5ee7ff" font-size="15" font-weight="700">3 · BARE METAL SUBSTRATE  (pbit-core)</text>
  <text x="100" y="658" fill="#c3cad9" font-size="13">p-bit kernels on your CPU: 64 probabilistic bits packed per 64-bit word, one shared random number per site · f32 heat-bath kernel</text>
  <text x="100" y="678" fill="#c3cad9" font-size="13">Philox4x32 counter RNG: reproducible, seedable, stream-splittable → with fixed work (--sweeps) the same seed gives the same decision</text>
  <text x="100" y="700" fill="#8b95ad" font-size="13">future hardware: pbit-ir lowers the same problem to a one-hot p-bit / QUBO topology that a real p-bit chip samples natively (not required today)</text>
  <line x1="884" y1="580" x2="884" y2="604" stroke="#8b95ad" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  <line x1="1315" y1="580" x2="1315" y2="604" stroke="#8b95ad" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr)"/>

  <!-- 4. OUTPUT -->
  <line x1="800" y1="740" x2="800" y2="780" stroke="#5ee7ff" stroke-width="3" marker-end="url(#arr)"/>
  <text x="815" y="766" fill="#5ee7ff" font-size="14">decision.json  (exit 0 plan · 3 refused · 1 infeasible · 2 bad input)</text>
  <rect x="60" y="784" width="1480" height="150" rx="12" fill="#0f1524" stroke="#2b3550" stroke-width="2"/>
  <text x="84" y="816" fill="#5ee7ff" font-size="15" font-weight="700">4 · THE DECISION, BACK IN YOUR APP</text>
  <text x="84" y="844" fill="#ffffff" font-size="16">plan  {T001: "human", T002: "codex", …}   →  0 rule violations, always</text>
  <text x="84" y="870" fill="#ffffff" font-size="16">odds  {T001: {human 0.52, local-gemma 0.48}, …}   →  Monte-Carlo estimates with an error bar per task, checked against exact oracles</text>
  <text x="84" y="896" fill="#ffffff" font-size="16">released [ … ]   act on these now      escalated [ … ]   hand to a human or a bigger model</text>
  <text x="84" y="922" fill="#8b95ad" font-size="14">gate stats travel with every answer (R-hat, error bound, frozen workers, samples, seed) so the decision is auditable and reproducible</text>

  <text x="1540" y="980" fill="#3a4560" font-size="13" text-anchor="end">quantum-inspired p-bits on the CPU you have · no chip needed · Apache-2.0</text>
</svg>
