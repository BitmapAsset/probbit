# bench/body fixture (RFC 0002 part 2, load), bars l1-l5: load (half_life_hours 72, kappa 0.5, theta 0.5, cap 4) from
# criticism, the failure sense `fail` and expired decisions (weights 1), and a hold on the declared mood `strain` (above 1,
# 0.01 an hour). The sense has no effects; `strain_cue` is the only input that moves a mood. The no-load twin is
# variants/load-noload.yaml. Frozen with its sha256 in MANIFEST before any engine measurement.
probbit_persona: 1
identity:
  name: Body load
  version: 1.0.0
  seed: 0
  summary: repeated aversive events raise a slow load
traits:
  - id: caution
    levels: [measured, careful]
moods:
  - id: strain
    levels: [calm, strained]
inputs:
  - id: praise
    kind: flag
    say: the outcome was confirmed good
  - id: criticism
    kind: flag
    say: the outcome was judged bad
  - id: strain_cue
    kind: flag
    say: a straining situation continues
    effects: {strain: 1.5}
senses:
  - id: fail
    kind: flag
    unit: event
    src: [env]
    prior: {mean: 0.05, var: 0.05}
    drift_cap: 0.25
    say: tool failures
learning:
  from: [praise, criticism]
  traits: [caution]
  rate: 0.3
  step_cap: 0.1
  total_cap: 0.4
reward_from: [human, env]
load:
  half_life_hours: 72
  kappa: 0.5
  theta: 0.5
  cap: 4
  from: {criticism: 1, sense_fail: 1, expired: 1}
  hold: {mood: strain, above: 1, per_hour: 0.01}
