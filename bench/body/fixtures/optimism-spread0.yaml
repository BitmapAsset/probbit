# bench/body fixture (RFC 0002 Design D), bars o2, o3 and o5: optimism.yaml with optimism_spread 0 (the null of o2 and o3,
# and the P0 copy of o5). Frozen with its sha256 in MANIFEST before any engine measurement.
probbit_persona: 1
identity:
  name: Body optimism
  version: 1.0.0
  seed: 0
  summary: per-individual rates for better- and worse-than-expected wins
traits:
  - id: tone
    levels: [plain, warm]
inputs:
  - id: busy
    kind: flag
    say: the principal is busy
drives:
  goals:
    - id: task
    - id: other
  expectation: {rate: 0.2, half_life_hours: 48}
dispositions:
  optimism_spread: 0
habits:
  - id: busy_other
    when: {busy: true}
    then: {pursue: [other]}
    say: the principal is busy, do the other thing
