[package]
name = "probbit-cli"
description = "probbit: a virtual probabilistic (p-bit) processor for joint decisions under hard rules, with gated odds. JSON in, JSON out, zero dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["p-bit", "cli", "decision", "constraints", "probabilistic"]
categories = ["command-line-utilities", "algorithms", "science"]

[[bin]]
name = "probbit"
path = "src/main.rs"

[dependencies]
probbit-core = { path = "../probbit-core", version = "0.6.0" }
probbit-decide = { path = "../probbit-decide", version = "0.6.0" }
probbit-ir = { path = "../probbit-ir", version = "0.6.0" }
