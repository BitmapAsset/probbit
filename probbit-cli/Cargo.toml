[package]
name = "probbit-cli"
description = "probbit: a personality, mood and memory layer for AI agents on an exact p-bit decision engine (plans under hard rules, gated odds, refusal), simulated on a CPU. CLI and MCP server; JSON in, JSON out, zero dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["p-bit", "ai-agents", "mcp-server", "persona", "constraints"]
categories = ["command-line-utilities", "algorithms", "science"]

[[bin]]
name = "probbit"
path = "src/main.rs"

[dependencies]
probbit-core = { path = "../probbit-core", version = "0.13.0" }
probbit-decide = { path = "../probbit-decide", version = "0.13.0" }
probbit-ir = { path = "../probbit-ir", version = "0.13.0" }
