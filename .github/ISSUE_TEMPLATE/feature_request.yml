name: Feature request
description: A constraint type, instruction, control, front-end or integration probbit should have
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The decision you are trying to make
      description: What is being assigned or chosen, what the hard rules are, what the scores mean, and what you need back (a plan, odds, a verdict, a what-if).
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What probbit does today on it
      description: Where it falls short, with a command if you have one. `USE-CASES.md` lists what is and is not expressed in the current IR (cost budgets and overflow are known gaps).
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you have in mind, if any. Benchmarks or oracles that would show it working are a plus.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - probbit-ir (instruction set, exact tiers, sampler, gate)
        - probbit-decide (router front-end, JSON contract)
        - probbit CLI (flags, controls, telemetry)
        - integrations (bindings, MCP, packaging)
        - docs and benchmarks
