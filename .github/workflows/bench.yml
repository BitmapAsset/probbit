name: bench
# Portability and benchmark matrix: probbit built, tested and measured on each standard GitHub runner OS; static and cross
# builds; the installers (install.sh, install.ps1), the npm wrapper and the docs/agents.md recipes, each against a local
# server (no release needed). Runs on pushes to its own branch and by hand only, never on pull requests or main: macOS
# minutes bill at 10x on a private repo. Standard runners only. Results: BENCHMARK-MATRIX.md, PORTABILITY.md.
# The macOS Intel row (macos-15-intel: the slowest runner, at 10x) runs only when asked: "[intel]" in the pushed commit
# message, or the `intel` input of a manual run. It ran once, in run 36969399069.
on:
  push:
    branches: [r22-portability-matrix]
    paths-ignore: ["**.md", "scripts/bench/results/**"]
  workflow_dispatch:
    inputs:
      intel:
        description: also run the macOS Intel row (macos-15-intel)
        type: boolean
        default: false
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  TAG: v0.7.0

jobs:
  bench:
    name: bench ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(format('[{0}, {1}, {2}{3}]',
          '{"os": "ubuntu-latest", "label": "linux-x86_64", "target": "x86_64-unknown-linux-gnu", "py": "python3", "native": true, "timeout": 15}',
          '{"os": "macos-latest", "label": "macos-arm64", "target": "aarch64-apple-darwin", "py": "python3", "native": false, "timeout": 15}',
          '{"os": "windows-latest", "label": "windows-x86_64", "target": "x86_64-pc-windows-msvc", "py": "python", "native": true, "timeout": 15}',
          (inputs.intel || contains(github.event.head_commit.message, '[intel]')) && ', {"os": "macos-15-intel", "label": "macos-x86_64", "target": "x86_64-apple-darwin", "py": "python3", "native": true, "timeout": 12}' || '')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: bash
    env:
      PY: ${{ matrix.py }}
      LABEL: ${{ matrix.label }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: build (portable, as release.yml)
        id: build
        run: |
          mkdir -p out
          start=$(date +%s)
          cargo build --release --locked --workspace
          echo "build_s=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          cargo build --release --locked -p probbit-core --example kernels
          ls -l target/release/
      - name: build (-C target-cpu=native, for bench/portable_vs_native.py)
        id: native
        if: matrix.native
        continue-on-error: true
        env:
          RUSTFLAGS: -C target-cpu=native
        run: |
          cargo build --release --locked -p probbit-cli --target-dir target/native
          cargo build --release --locked -p probbit-core --example kernels --target-dir target/native

      - name: callers (shell pipe, python/probbit.py tests, examples/node/decide.mjs)
        id: callers
        continue-on-error: true
        run: |
          B="$PWD/target/release/probbit"
          if [ "$RUNNER_OS" = Windows ]; then B="$(cygpath -w "$B.exe")"; fi
          export PROBBIT_BIN="$B"
          mkdir -p onpath && cp target/release/probbit* onpath/ 2> /dev/null || true
          export PATH="$PWD/onpath:$PATH"
          {
            echo "\$ probbit demo --tasks 12 | probbit decide --pretty   ($(command -v probbit))"
            probbit demo --tasks 12 | probbit decide --pretty > d12.json
            echo "exit $?"; sed -n 1,8p d12.json
            probbit demo --tasks 24 > router.json
            echo "\$ probbit decide --budget-ms 200 < router.json > decision.json; case \$? in ..."
            probbit decide --budget-ms 200 < router.json > decision.json && rc=0 || rc=$?
            case $rc in 0) echo answer ;; 1) echo infeasible ;; 2) echo "bad input" ;; 3) echo "refused: escalate" ;; *) echo "exit $rc"; exit 1 ;; esac
            $PY -c 'import json,sys; print(json.load(sys.stdin)["verdict"])' < decision.json
            echo "\$ $PY python/test_probbit.py"
            $PY python/test_probbit.py
            echo "\$ $PY python/examples/route_agents.py"
            $PY python/examples/route_agents.py
            echo "\$ node examples/node/decide.mjs   (node $(node --version))"
            node examples/node/decide.mjs
          } 2>&1 | tee "out/callers-$LABEL.txt"

      - name: install.sh (release.yml layout, served on 127.0.0.1)
        id: install_sh
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          for s in sh bash dash; do
            command -v "$s" > /dev/null || continue
            SH=$s sh scripts/bench/test_install_sh.sh target/release/probbit "$TARGET" "$TAG"
          done 2>&1 | tee "out/install-sh-$LABEL.txt"

      - name: npm wrapper (npm pack, npm install -g from 127.0.0.1, npm uninstall -g)
        id: npm
        if: runner.os == 'Linux'
        continue-on-error: true
        run: sh scripts/bench/test_npm.sh target/release/probbit "$TARGET" "$TAG" 2>&1 | tee "out/npm-$LABEL.txt"
      - name: npm wrapper on Windows (informational)
        id: npm_windows
        if: runner.os == 'Windows'
        continue-on-error: true
        run: sh scripts/bench/test_npm.sh target/release/probbit.exe "$TARGET" "$TAG" 2>&1 | tee "out/npm-$LABEL.txt"

      # PowerShell scripts are started from bash (pwsh/powershell -File, exit code 1 on a throw): redirecting a native
      # command's stderr inside a pwsh step can itself raise under the runner's ErrorActionPreference = stop.
      - name: pack a release-layout .zip for install.ps1
        id: pack_zip
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          sh scripts/bench/package_like_release.sh target/release/probbit.exe "$TARGET" "$TAG" "srv/good/$TAG"
          cp -R srv/good srv/bad
          printf '%064d  %s\n' 0 "probbit-$TAG-$TARGET.zip" > "srv/bad/$TAG/probbit-$TAG-$TARGET.zip.sha256"
          ls -l "srv/good/$TAG"; cat "srv/good/$TAG/probbit-$TAG-$TARGET.zip.sha256"
      - name: install.ps1 under PowerShell 7
        id: install_ps1_pwsh
        if: runner.os == 'Windows'
        continue-on-error: true
        run: pwsh -NoProfile -File scripts/bench/test_install_ps1.ps1 -Srv srv -Tag "$TAG" -AddToPath 2>&1 | tee "out/install-ps1-pwsh-$LABEL.txt"
      - name: install.ps1 under Windows PowerShell 5.1
        id: install_ps1_ps51
        if: runner.os == 'Windows'
        continue-on-error: true
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bench/test_install_ps1.ps1 -Srv srv -Tag "$TAG" 2>&1 | tee "out/install-ps1-ps51-$LABEL.txt"
      - name: callers (PowerShell 7 and Windows PowerShell 5.1)
        id: ps_callers
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          export PATH="$PWD/target/release:$PATH"
          { pwsh -NoProfile -File scripts/bench/callers.ps1
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bench/callers.ps1; } 2>&1 | tee "out/callers-powershell-$LABEL.txt"
      - name: peak RSS via Get-Process (cross-check of the harness value)
        id: rss_ps
        if: runner.os == 'Windows'
        continue-on-error: true
        run: pwsh -NoProfile -File scripts/bench/peak_rss_windows.ps1 -Exe target/release/probbit.exe -Out out/peak-rss-powershell.json

      - name: cross build x86_64-apple-darwin on the arm64 runner (Rosetta smoke if present)
        id: cross_darwin
        if: matrix.label == 'macos-arm64'
        continue-on-error: true
        run: |
          {
            echo "\$ rustup target add x86_64-apple-darwin"; rustup target add x86_64-apple-darwin
            echo "\$ cargo build --release --locked -p probbit-cli --target x86_64-apple-darwin"
            cargo build --release --locked -p probbit-cli --target x86_64-apple-darwin 2>&1 | tail -1
            B=target/x86_64-apple-darwin/release/probbit
            echo "\$ file $B"; file "$B"
            echo "\$ lipo -archs $B"; lipo -archs "$B"
            echo "\$ otool -L $B"; otool -L "$B"
            echo "size $(stat -f %z "$B") bytes"
            if /usr/bin/arch -x86_64 /usr/bin/true 2> /dev/null; then
              echo "rosetta: present"
              echo "\$ arch -x86_64 $B version"; /usr/bin/arch -x86_64 "$B" version
              /usr/bin/arch -x86_64 "$B" demo --tasks 12 | /usr/bin/arch -x86_64 "$B" decide > d12-x86.json
              echo "\$ arch -x86_64 probbit demo --tasks 12 | arch -x86_64 probbit decide: exit $?, verdict $(python3 -c 'import json; print(json.load(open("d12-x86.json"))["verdict"])')"
              echo "\$ arch -x86_64 probbit stats (self-test under Rosetta)"
              /usr/bin/arch -x86_64 "$B" stats | python3 -c 'import json,sys; s=json.load(sys.stdin)["self_test"]; print("1 thread", s["site_updates_per_s_1_thread"], "| threads", s["threads"], s["site_updates_per_s"])'
            else
              echo "rosetta: absent, build only"
            fi
          } 2>&1 | tee out/cross-x86_64-apple-darwin.txt

      - name: record check outcomes
        if: always()
        run: |
          mkdir -p out
          cat > "out/checks-$LABEL.json" << EOF
          {"build": "${{ steps.build.outcome }}", "native_build": "${{ steps.native.outcome }}", "pack_zip": "${{ steps.pack_zip.outcome }}", "callers": "${{ steps.callers.outcome }}", "install_sh": "${{ steps.install_sh.outcome }}",
           "npm": "${{ steps.npm.outcome }}", "npm_windows": "${{ steps.npm_windows.outcome }}",
           "install_ps1_pwsh": "${{ steps.install_ps1_pwsh.outcome }}", "install_ps1_ps51": "${{ steps.install_ps1_ps51.outcome }}",
           "ps_callers": "${{ steps.ps_callers.outcome }}", "rss_powershell": "${{ steps.rss_ps.outcome }}",
           "cross_darwin": "${{ steps.cross_darwin.outcome }}"}
          EOF
          cat "out/checks-$LABEL.json"
      - name: measure (scripts/bench/matrix_bench.py, N = 5)
        id: measure
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -- --attach "checks=out/checks-$LABEL.json" --note "build_s=${{ steps.build.outputs.build_s }}" --note "runner=${{ matrix.os }}"
          if [ "${{ steps.native.outcome }}" = success ]; then set -- "$@" --native-dir target/native/release; fi
          if [ -f out/peak-rss-powershell.json ]; then set -- "$@" --attach peak_rss_powershell=out/peak-rss-powershell.json; fi
          if [ -f out/cross-x86_64-apple-darwin.txt ]; then set -- "$@" --attach cross_x86_64_apple_darwin=out/cross-x86_64-apple-darwin.txt; fi
          $PY scripts/bench/matrix_bench.py --bin target/release/probbit --label "$LABEL" --out "out/bench-$LABEL.json" "$@"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ matrix.label }}
          path: out/
          if-no-files-found: warn
      - name: fail the job if a required check failed
        if: always()
        run: |
          fail=0
          for kv in callers=${{ steps.callers.outcome }} install_sh=${{ steps.install_sh.outcome }} npm=${{ steps.npm.outcome }} \
                    install_ps1_pwsh=${{ steps.install_ps1_pwsh.outcome }} install_ps1_ps51=${{ steps.install_ps1_ps51.outcome }} \
                    ps_callers=${{ steps.ps_callers.outcome }} measure=${{ steps.measure.outcome }}; do
            case "$kv" in *=failure | *=cancelled) echo "required check failed: $kv"; fail=1 ;; esac
          done
          exit $fail

  test:
    name: test ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(format('[{0}, {1}, {2}{3}]',
          '{"os": "ubuntu-latest", "label": "linux-x86_64", "py": "python3", "timeout": 15}',
          '{"os": "macos-latest", "label": "macos-arm64", "py": "python3", "timeout": 15}',
          '{"os": "windows-latest", "label": "windows-x86_64", "py": "python", "timeout": 15}',
          (inputs.intel || contains(github.event.head_commit.message, '[intel]')) && ', {"os": "macos-15-intel", "label": "macos-x86_64", "py": "python3", "timeout": 12}' || '')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test --release --locked --workspace --no-fail-fast
        run: |
          mkdir -p out
          start=$(date +%s)
          set +e
          cargo test --release --locked --workspace --no-fail-fast 2>&1 | tee "out/test-${{ matrix.label }}.log"
          rc=${PIPESTATUS[0]}
          set -e
          ${{ matrix.py }} scripts/bench/test_summary.py "out/test-${{ matrix.label }}.log" "$rc" "$(( $(date +%s) - start ))" \
            "${{ matrix.label }}" > "out/test-${{ matrix.label }}.json" || echo "test_summary.py failed"
          grep -E '"(passed|seconds|exit)"' "out/test-${{ matrix.label }}.json" || true
          exit "$rc"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-${{ matrix.label }}
          path: out/
          if-no-files-found: warn

  cross:
    name: static and cross builds (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: x86_64-unknown-linux-musl (static)
        id: musl_x86
        continue-on-error: true
        run: |
          mkdir -p out
          {
            echo "\$ rustup target add x86_64-unknown-linux-musl"; rustup target add x86_64-unknown-linux-musl
            echo "\$ cargo build --release --locked -p probbit-cli --target x86_64-unknown-linux-musl"
            cargo build --release --locked -p probbit-cli --target x86_64-unknown-linux-musl 2>&1 | tail -1
            B=target/x86_64-unknown-linux-musl/release/probbit
            echo "\$ file $B"; file "$B"
            echo "\$ ldd $B"; ldd "$B" 2>&1 || true
            echo "size $(stat -c %s "$B") bytes"
            echo "\$ $B version"; "$B" version
            "$B" demo --tasks 12 | "$B" decide > d12.json
            echo "\$ probbit demo --tasks 12 | probbit decide: exit $?, verdict $(python3 -c 'import json; print(json.load(open("d12.json"))["verdict"])')"
          } 2>&1 | tee out/musl-x86_64.txt
      - name: glibc build in the same VM (for the musl vs glibc comparison)
        run: cargo build --release --locked -p probbit-cli 2>&1 | tail -1
      - name: aarch64-unknown-linux-musl (cross-linked; qemu smoke if installable within 120 s)
        id: musl_arm
        continue-on-error: true
        run: |
          {
            echo "\$ sudo apt-get install -y gcc-aarch64-linux-gnu"
            t0=$(date +%s); sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu > /dev/null
            echo "linker installed in $(( $(date +%s) - t0 )) s"
            echo "\$ rustup target add aarch64-unknown-linux-musl"; rustup target add aarch64-unknown-linux-musl
            echo "\$ CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc cargo build --release --locked -p probbit-cli --target aarch64-unknown-linux-musl"
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc cargo build --release --locked -p probbit-cli --target aarch64-unknown-linux-musl 2>&1 | tail -1
            B=target/aarch64-unknown-linux-musl/release/probbit
            echo "\$ file $B"; file "$B"
            echo "size $(stat -c %s "$B") bytes"
            t0=$(date +%s)
            if timeout 120 sudo apt-get install -y -qq qemu-user-static > /dev/null 2>&1; then
              echo "qemu-user-static installed in $(( $(date +%s) - t0 )) s"
              Q=$(command -v qemu-aarch64-static || command -v qemu-aarch64)
              echo "\$ $(basename "$Q") $B version"; "$Q" "$B" version
              "$Q" "$B" demo --tasks 12 | "$Q" "$B" decide > d12-arm.json
              echo "\$ qemu probbit demo --tasks 12 | qemu probbit decide: exit $?, verdict $(python3 -c 'import json; print(json.load(open("d12-arm.json"))["verdict"])')"
            else
              echo "qemu-user-static: not installed within 120 s, build only"
            fi
          } 2>&1 | tee out/musl-aarch64.txt
      - name: wasm32-wasip1 feasibility probe (cargo check, nothing fixed)
        id: wasm
        continue-on-error: true
        run: |
          {
            echo "\$ rustup target add wasm32-wasip1"; rustup target add wasm32-wasip1
            echo "\$ cargo check --target wasm32-wasip1 -p probbit-ir -p probbit-decide"
            set +e; cargo check --target wasm32-wasip1 -p probbit-ir -p probbit-decide > wasm.log 2>&1; rc=$?; set -e
            echo "exit $rc"; echo "first error: $(grep -m1 -E '^error' wasm.log || echo none)"; tail -3 wasm.log
          } 2>&1 | tee out/wasm32-wasip1.txt
      - name: minimum Rust version probes (debug builds of probbit-cli)
        id: msrv
        continue-on-error: true
        run: |
          {
            for v in 1.72 1.73 1.77 1.78; do
              rustup toolchain install "$v" --profile minimal --no-self-update > /dev/null 2>&1 || { echo "rust $v: toolchain install failed"; continue; }
              flags=--locked; how="--locked (Cargo.lock as committed, lockfile v4)"
              if [ "$v" = 1.72 ] || [ "$v" = 1.73 ]; then mv Cargo.lock Cargo.lock.v4; flags=""; how="Cargo.lock moved aside (cargo < 1.78 cannot read lockfile v4)"; fi
              set +e; cargo "+$v" build $flags -p probbit-cli --target-dir "target/msrv-$v" > "msrv-$v.log" 2>&1; rc=$?; set -e
              if [ -f Cargo.lock.v4 ]; then rm -f Cargo.lock; mv Cargo.lock.v4 Cargo.lock; fi
              if [ "$rc" = 0 ]; then echo "rust $v: build ok, $how"; else echo "rust $v: build FAILED, $how: $(grep -m1 -E '^error' "msrv-$v.log")"; fi
            done
            echo "Cargo.lock restored: $(git status --short Cargo.lock | wc -l | tr -d ' ') changes"
          } 2>&1 | tee out/msrv.txt
      - name: measure the static (musl) and glibc binaries in this VM (N = 5)
        id: measure
        continue-on-error: true
        run: |
          python3 scripts/bench/matrix_bench.py --bin target/x86_64-unknown-linux-musl/release/probbit --label linux-x86_64-musl --out out/bench-linux-x86_64-musl.json --note "static musl build, same VM as bench-linux-x86_64-gnu-samevm"
          python3 scripts/bench/matrix_bench.py --bin target/release/probbit --label linux-x86_64-gnu-samevm --out out/bench-linux-x86_64-gnu-samevm.json --note "glibc build, same VM as the musl row"
      - name: one JSON for the job
        if: always()
        env:
          OUTCOMES: '{"musl_x86_64": "${{ steps.musl_x86.outcome }}", "musl_aarch64": "${{ steps.musl_arm.outcome }}", "wasm32_wasip1": "${{ steps.wasm.outcome }}", "msrv": "${{ steps.msrv.outcome }}", "measure": "${{ steps.measure.outcome }}"}'
        run: |
          python3 - << 'EOF'
          import glob, json, os, sys, time
          sys.path.insert(0, "scripts/bench")
          from matrix_bench import machine, runner, toolchain
          out = {"schema": "probbit-cross/1", "label": "cross-linux-x86_64", "date_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                 "outcomes": json.loads(os.environ["OUTCOMES"]), "runner": runner(), "machine": machine(), "toolchain": toolchain(),
                 "transcripts": {os.path.basename(p): open(p).read().splitlines() for p in sorted(glob.glob("out/*.txt"))},
                 "bench": {os.path.basename(p)[6:-5]: json.load(open(p)) for p in sorted(glob.glob("out/bench-*.json"))}}
          json.dump(out, open("out/cross-linux-x86_64.json", "w"), indent=1)
          print(json.dumps(out["outcomes"]))
          EOF
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cross-linux-x86_64
          path: out/
          if-no-files-found: warn
