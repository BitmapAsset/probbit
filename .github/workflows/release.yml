name: release
# Builds portable release binaries for every `v*` tag and attaches them to a DRAFT GitHub release.
# A maintainer reviews the draft and publishes it; nothing goes public automatically.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build (portable, no CPU pin)
        run: cargo build --release --locked -p pbit-cli --target ${{ matrix.target }}
      - name: smoke test
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/pbit"
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"
          "$BIN" version
          "$BIN" demo --tasks 12 | "$BIN" decide --pretty | head -8
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          NAME="pbit-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/pbit.exe" "dist/$NAME/"
          else
            cp "target/${{ matrix.target }}/release/pbit" "dist/$NAME/"
          fi
          cp README.md LICENSE CHANGELOG.md "dist/$NAME/"
          cp -R examples python docs "dist/$NAME/"   # JSON examples, the Python wrapper, the IR spec and docs/agents.md
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            ASSET="$NAME.zip"; 7z a "$ASSET" "$NAME" > /dev/null
          else
            ASSET="$NAME.tar.gz"; tar czf "$ASSET" "$NAME"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$ASSET" > "$ASSET.sha256"; else shasum -a 256 "$ASSET" > "$ASSET.sha256"; fi
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/${{ env.ASSET }}
            dist/${{ env.ASSET }}.sha256
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "pbit $GITHUB_REF_NAME" \
              --notes "Portable builds (no CPU pin) for Linux x86_64, macOS (Apple silicon and Intel) and Windows x86_64. Verify an archive with the .sha256 file beside it. What changed: see CHANGELOG.md."
          fi
