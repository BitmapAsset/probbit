name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --release --workspace
      - name: test
        run: cargo test --release --workspace
      - name: demo pipeline (pbit demo | pbit decide)
        shell: bash
        run: |
          cargo run --release -p pbit-cli -- demo --tasks 12 | cargo run --release -p pbit-cli -- decide --pretty
          cargo run --release -p pbit-cli -- demo --tasks 300 | cargo run --release -p pbit-cli -- decide --budget-ms 300
      - name: processor spec sheet (pbit stats)
        run: cargo run --release -p pbit-cli -- stats --pretty
      - name: agent_router example
        run: cargo run --release --example agent_router
