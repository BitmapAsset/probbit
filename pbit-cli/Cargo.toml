[package]
name = "pbit-cli"
description = "pbit: a virtual probabilistic (p-bit) processor for joint decisions under hard rules, with gated odds. JSON in, JSON out, zero dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["p-bit", "cli", "decision", "constraints", "probabilistic"]
categories = ["command-line-utilities", "algorithms", "science"]

[[bin]]
name = "pbit"
path = "src/main.rs"

[dependencies]
pbit-core = { path = "../pbit-core" }
pbit-decide = { path = "../pbit-decide" }
pbit-ir = { path = "../pbit-ir" }
