[package]
name = "probbit-decide"
description = "Joint constrained decision engine: feasible plans, plan odds, marginals, what-if, calibrated refusal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["p-bit", "assignment", "routing", "constraints", "probabilistic"]
categories = ["algorithms", "science"]

[features]
default = ["std"]
std = ["probbit-core/std", "probbit-ir/std"]
# no_std + alloc (a target without an operating system): the std subset comes from probbit-nostd
nostd = ["dep:probbit-nostd", "probbit-core/nostd", "probbit-ir/nostd"]

[dependencies]
probbit-nostd = { path = "../probbit-nostd", version = "0.14.0-dev", optional = true }
probbit-core = { path = "../probbit-core", default-features = false, version = "0.14.0-dev" }
probbit-ir = { path = "../probbit-ir", default-features = false, version = "0.14.0-dev" }
