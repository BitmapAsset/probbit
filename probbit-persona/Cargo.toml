[package]
name = "probbit-persona"
description = "probbit's document layer as a library: JSON/YAML documents, the persona layer, run/decide/evaluate, and the strand writer and verifier; std or no_std + alloc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["p-bit", "persona", "no-std", "decision", "probabilistic"]
categories = ["algorithms", "no-std", "science"]

[features]
default = ["std", "decide"]
std = ["probbit-core/std", "probbit-ir/std", "probbit-decide?/std"]
# no_std + alloc (a target without an operating system): the std subset comes from probbit-nostd; documents come in as strings
nostd = ["dep:probbit-nostd", "probbit-core/nostd", "probbit-ir/nostd", "probbit-decide?/nostd"]
# `router` (probbit decide) and `evaluate` (the decision-API adapter): probbit-decide
decide = ["dep:probbit-decide"]
# `turn_trace` (off by default): per-phase microseconds and a host probe's bytes for the last `Live::event` (`persona::trace`)
turn_trace = []

[dependencies]
probbit-nostd = { path = "../probbit-nostd", version = "0.14.0", optional = true }
probbit-core = { path = "../probbit-core", default-features = false, version = "0.14.0" }
probbit-ir = { path = "../probbit-ir", default-features = false, version = "0.14.0" }
probbit-decide = { path = "../probbit-decide", default-features = false, version = "0.14.0", optional = true }
