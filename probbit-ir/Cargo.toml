[package]
name = "probbit-ir"
description = "probbit-ir: the instruction set of the probbit virtual p-bit processor. Constrained categorical fields, exact enumeration, constraint-preserving Gibbs, diagnostics gate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["p-bit", "constraints", "gibbs-sampling", "probabilistic", "ising"]
categories = ["algorithms", "science", "mathematics"]

[features]
default = ["std"]
std = ["probbit-core/std"]
# no_std + alloc (a target without an operating system): the std subset comes from probbit-nostd
nostd = ["dep:probbit-nostd", "probbit-core/nostd"]

[dependencies]
probbit-nostd = { path = "../probbit-nostd", version = "0.14.0-dev", optional = true }
probbit-core = { path = "../probbit-core", default-features = false, version = "0.14.0-dev" }
